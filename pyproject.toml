[project]
name = "swarm"
version = "0.1.0"
description = "Apart Swarm Alignment Hackathon (Nov 6-8, 2026)"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "httpx>=0.27",
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=16",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "networkx>=3.3",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "adaption>=0.19.0",
    "python-docx>=1.2.0",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
